  <text class="what a" style="animation-delay:0.16s" x="24" y="92">M.S. Computer Science</text>
  <text class="where a" style="animation-delay:0.19s" x="24" y="109">USC · GPA 3.75 / 4.0</text>
  <text class="when a" style="animation-delay:0.22s" x="24" y="136">2019 - 2023</text>
  <text class="what a" style="animation-delay:0.26s" x="24" y="154">B.E. Computer Engineering</text>
  <text class="where a" style="animation-delay:0.29s" x="24" y="171">Mumbai · CGPA 9.05 / 10</text>
  <text class="when a" style="animation-delay:0.32s" x="24" y="198">AWARD</text>
  <text class="what a" style="animation-delay:0.36s" x="24" y="216">Certificate of Achievement</text>
  <text class="where a" style="animation-delay:0.39s" x="24" y="233">from the CTO, IIFL Finance</text>
