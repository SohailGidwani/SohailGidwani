<svg xmlns="http://www.w3.org/2000/svg" width="428" height="259" viewBox="0 0 428 259" role="img" aria-label="EXPERIENCE. OCT 2025 - NOW: Research Assistant, Keck School of Medicine, USC. MAY - JUL 2025: Senior Software Engineer I, Insaito, Inc.. JUN 2023 - MAY 2025: Full Stack Software Developer, IIFL Finance Ltd">
<style>
@font-face{font-family:'Martian';font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Martian';font-weight:700;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}
.s{font-family:'Martian',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
text{white-space:pre}
.dotgrid{fill:#101114;opacity:.05}
.tag{font-size:10px;letter-spacing:2.2px;fill:#1938d7}
.when{font-size:10px;letter-spacing:1.6px;fill:#1938d7}
.what{font-size:14px;font-weight:700;fill:#101114}
.where{font-size:11.5px;fill:#60646d}
.a{opacity:0;animation:rise .5s cubic-bezier(.25,1,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.rule{animation:draw .55s cubic-bezier(.32,.72,0,1) .1s both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cursor{animation:blink 1.1s steps(1) .95s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .a{opacity:1;animation:none}.rule{animation:none}.cursor{animation:none;opacity:1}
  .tl{animation:none;clip-path:none;opacity:1}
}
</style>
<defs><pattern id="dg" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.1" class="dotgrid"/></pattern></defs>
<rect width="428" height="259" rx="6" fill="#f6f7f9"/>
<rect width="428" height="259" rx="6" fill="url(#dg)"/>
<rect x=".75" y=".75" width="426.5" height="257.5" rx="6" fill="none" stroke="#d8dbe1" stroke-width="1.5"/>
<g class="s">
  <text class="tag a" style="animation-delay:.04s" x="24" y="38">EXPERIENCE</text>
  <line class="a" style="animation-delay:.08s" x1="24" y1="52" x2="404" y2="52" stroke="#d8dbe1" stroke-width="1"/>
  <text class="when a" style="animation-delay:0.12s" x="24" y="74">OCT 2025 - NOW</text>
  <text class="what a" style="animation-delay:0.16s" x="24" y="92">Research Assistant</text>
  <text class="where a" style="animation-delay:0.19s" x="24" y="109">Keck School of Medicine, USC</text>
  <text class="when a" style="animation-delay:0.22s" x="24" y="136">MAY - JUL 2025</text>
  <text class="what a" style="animation-delay:0.26s" x="24" y="154">Senior Software Engineer I</text>
  <text class="where a" style="animation-delay:0.29s" x="24" y="171">Insaito, Inc.</text>
  <text class="when a" style="animation-delay:0.32s" x="24" y="198">JUN 2023 - MAY 2025</text>
  <text class="what a" style="animation-delay:0.36s" x="24" y="216">Full Stack Software Developer</text>
  <text class="where a" style="animation-delay:0.39s" x="24" y="233">IIFL Finance Ltd</text>
</g>
</svg>
