<svg xmlns="http://www.w3.org/2000/svg" width="880" height="462" viewBox="0 0 880 462" role="img" aria-label="Sohail Gidwani, Agentic AI/ML Engineer">
<style>
@font-face{font-family:'JBMono';src:local('JetBrains Mono'),local('JetBrainsMono-Regular'),local('SFMono-Regular'),local('Menlo'),local('Consolas');font-display:swap;size-adjust:104%}
.s{font-family:'JBMono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
text{white-space:pre}
.name{font-size:38px;font-weight:700;letter-spacing:-1.2px;fill:#111110}
.sub{font-size:12.5px;letter-spacing:2.6px;fill:#73726d}
.lbl{font-size:11px;letter-spacing:2.4px;fill:#b85c0e}
.val{font-size:13.5px;fill:#73726d}
.lead{fill:#111110;font-weight:700}
.rest{fill:#73726d}
.foot{font-size:11px;letter-spacing:2.2px;fill:#73726d}
.dotgrid{fill:#111110;opacity:.05}

/* Assembly: each element rises a few pixels as it fades up. Reduced motion
   collapses the whole thing to the finished card, which is why every rule
   below is duplicated under the media query rather than merely shortened. */
.a{opacity:0;animation:rise .5s cubic-bezier(.25,1,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.rule{transform-origin:34px 118px;animation:draw .55s cubic-bezier(.32,.72,0,1) .1s both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cursor{animation:blink 1.1s steps(1) .95s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .a{opacity:1;animation:none}
  .rule{animation:none}
  .cursor{animation:none;opacity:1}
}
</style>
<rect width="880" height="462" rx="6" fill="#f7f6f3"/>
<rect x="1" y="1" width="878" height="460" rx="6" fill="none" stroke="#dddbd4" stroke-width="1.5"/>
<defs><pattern id="dg" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.1" class="dotgrid"/></pattern></defs>
<rect width="880" height="462" rx="6" fill="url(#dg)"/>

<g class="s">
  <text class="name a" style="animation-delay:0s" x="34" y="86">SOHAIL GIDWANI</text>
  <rect class="rule" x="34" y="110" width="812" height="2.5" fill="#b85c0e"/>
  <text class="sub a" style="animation-delay:.16s" x="34" y="140">AGENTIC AI/ML ENGINEER   ·   M.S. COMPUTER SCIENCE @ USC</text>

  <text class="lbl a" style="animation-delay:0.08s" x="34" y="182">NOW</text>
  <text class="val a" style="animation-delay:0.16s" x="152" y="182"><tspan class="lead">Research Assistant</tspan><tspan class="rest"> · Keck School of Medicine of USC</tspan></text>
  <text class="val a" style="animation-delay:0.24s" x="152" y="208"><tspan class="lead">MEMOIR-VLM</tspan><tspan class="rest"> · multimodal VLM for Alzheimer’s · manuscript in review</tspan></text>
  <text class="lbl a" style="animation-delay:0.32s" x="34" y="252">PROOF</text>
  <text class="val a" style="animation-delay:0.40s" x="152" y="252"><tspan class="lead">0.933</tspan><tspan class="rest"> balanced accuracy CN vs Dementia   ·   2,363 ADNI subjects   ·   ~70M params</tspan></text>
  <text class="val a" style="animation-delay:0.48s" x="152" y="278"><tspan class="lead">61.9%</tspan><tspan class="rest"> strict green, 21 autonomous runs   ·   Portage migration agent</tspan></text>
  <text class="lbl a" style="animation-delay:0.56s" x="34" y="322">STACK</text>
  <text class="val a" style="animation-delay:0.64s" x="152" y="322"><tspan class="rest">PyTorch · LangGraph · FastAPI · Postgres · pgvector · Qdrant · Docker · Next.js</tspan></text>
  <text class="lbl a" style="animation-delay:0.72s" x="34" y="366">OPEN TO</text>
  <text class="val a" style="animation-delay:0.80s" x="152" y="366"><tspan class="rest">Full-time AI / ML / LLM engineering roles   ·   graduating May 2027   ·   Los Angeles</tspan></text>

  <line class="rule2 a" style="animation-delay:0.88s" x1="34" y1="414" x2="846" y2="414" stroke="#dddbd4" stroke-width="1"/>
  <text class="foot a" style="animation-delay:0.96s" x="34" y="436">SOHAILGIDWANI.APP<tspan class="cursor" fill="#b85c0e"> █</tspan></text>
  <text class="foot a" style="animation-delay:1.04s" x="846" y="436" text-anchor="end">MCP  ·  LLMS.TXT  ·  RESUME.JSON</text>
</g>
</svg>
