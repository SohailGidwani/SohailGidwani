<svg xmlns="http://www.w3.org/2000/svg" width="428" height="186" viewBox="0 0 428 186" role="img" aria-label="MEMOIR-VLM, RESEARCH · KECK USC. Multimodal vision-language model for Alzheimer’s classification and VQA. 0.933 bal. acc.  ·  2,363 subjects  ·  ~70M">
<style>
@font-face{font-family:'JBM';font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'JBM';font-weight:700;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}
.s{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
text{white-space:pre}
.dotgrid{fill:#111110;opacity:.05}
.tag{font-size:10px;letter-spacing:2.2px;fill:#b85c0e}
.ttl{font-size:23px;font-weight:700;letter-spacing:-.6px;fill:#111110}
.bdy{font-size:12px;fill:#73726d}
.met{font-size:11.5px}
.lead{fill:#111110;font-weight:700}
.rest{fill:#73726d}
.arw{font-size:15px;fill:#b85c0e}
.a{opacity:0;animation:rise .5s cubic-bezier(.25,1,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.rule{animation:draw .55s cubic-bezier(.32,.72,0,1) .1s both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cursor{animation:blink 1.1s steps(1) .95s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.a{opacity:1;animation:none}.rule{animation:none}.cursor{animation:none;opacity:1}}
</style>
<defs><pattern id="dg" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.1" class="dotgrid"/></pattern></defs>
<rect width="428" height="186" rx="6" fill="#f7f6f3"/>
<rect width="428" height="186" rx="6" fill="url(#dg)"/>
<rect x=".75" y=".75" width="426.5" height="184.5" rx="6" fill="none" stroke="#dddbd4" stroke-width="1.5"/>
<g class="s">
  <text class="tag a" style="animation-delay:.04s" x="24" y="38">RESEARCH · KECK USC</text>
  <text class="ttl a" style="animation-delay:.12s" x="24" y="72">MEMOIR-VLM</text>
  <text class="bdy a" style="animation-delay:.2s" x="24" y="104">Multimodal vision-language model for</text>
  <text class="bdy a" style="animation-delay:.26s" x="24" y="122">Alzheimer’s classification and VQA.</text>
  <line class="a" style="animation-delay:.32s" x1="24" y1="142" x2="404" y2="142" stroke="#dddbd4" stroke-width="1"/>
  <text class="met a" style="animation-delay:.38s" x="24" y="166"><tspan class="lead">0.933</tspan><tspan class="rest"> bal. acc.  ·  2,363 subjects  ·  ~70M</tspan></text>
  <text class="arw a" style="animation-delay:.44s" x="404" y="166" text-anchor="end">→</text>
</g>
</svg>
